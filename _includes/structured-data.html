<!-- Organization Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.name }}",
  "alternateName": "Hubofcode",
  "url": "{{ site.url }}",
  "description": "{{ site.description }}",
  "publisher": {
    "@type": "Person",
    "name": "Samuel James",
    "alternateName": "James Samuel Abiodun",
    "url": "{{ site.url }}/about",
    "image": "{{ site.url }}{{ site.avatar }}",
    "sameAs": [
      "https://twitter.com/samueljabiodun",
      "https://www.linkedin.com/in/samuel-james-abiodun",
      "https://github.com/abiodunjames"
    ],
    "jobTitle": "Engineering Manager",
    "worksFor": {
      "@type": "Organization",
      "name": "Reddit"
    }
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{ site.url }}/search?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  },
  "inLanguage": "{{ site.lang | default: 'en-US' }}"
}
</script>

<!-- Breadcrumb Schema -->
{% if page.url != "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}"
    }{% if page.categories.size > 0 %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.categories[0] }}",
      "item": "{{ site.url }}/categories/#{{ page.categories[0] | slugify }}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.title }}",
      "item": "{{ site.url }}{{ page.url }}"
    }{% else %},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ page.title }}",
      "item": "{{ site.url }}{{ page.url }}"
    }{% endif %}
  ]
}
</script>
{% endif %}
