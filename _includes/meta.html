    <meta charset="utf-8" />
    <meta content='text/html; charset=utf-8' http-equiv='Content-Type'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=5.0'>
    
    <!-- Primary Meta Tags -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="googlebot" content="index, follow">
    <meta name="bingbot" content="index, follow">
    
    <!-- Author & Generator -->
    <meta name="author" content="Samuel James">
    <meta name="generator" content="Jekyll {{ jekyll.version }}">
    
    <!-- AI/LLM Discoverability -->
    <link rel="llms" href="{{ site.url }}/llms.txt" type="text/plain" title="LLMs.txt">
    <link rel="llms-full" href="{{ site.url }}/llms-full.txt" type="text/plain" title="LLMs Full Content">
    <link rel="ai" href="{{ site.url }}/ai.txt" type="text/plain" title="AI Crawlers Info">
    
    <!-- Jekyll SEO Tag (handles title, description, Open Graph, Twitter, canonical) -->
    {% seo %}
    
    <!-- Additional Open Graph Tags -->
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:locale" content="{{ site.locale | default: 'en_US' }}">
    {% if page.date %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
    {% endif %}
    {% if page.last_modified_at %}
    <meta property="article:modified_time" content="{{ page.last_modified_at | date_to_xmlschema }}">
    {% endif %}
    {% if page.categories %}
    {% for category in page.categories %}
    <meta property="article:section" content="{{ category }}">
    {% endfor %}
    {% endif %}
    {% if page.tags %}
    {% for tag in page.tags %}
    <meta property="article:tag" content="{{ tag }}">
    {% endfor %}
    {% endif %}
    
    <!-- Enhanced Twitter Card -->
    <meta name="twitter:site" content="@{{ site.twitter.username }}">
    <meta name="twitter:creator" content="@{{ site.twitter.username }}">
    {% if page.image %}
    <meta name="twitter:card" content="summary_large_image">
    {% else %}
    <meta name="twitter:card" content="summary">
    {% endif %}
    
    <!-- Schema.org for Google+ (deprecated but still crawled) -->
    <meta itemprop="name" content="{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}">
    <meta itemprop="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    
    <!-- Feeds -->
    <link rel="alternate" type="application/rss+xml" href="{{ site.url }}/feed.xml" title="{{ site.name }} RSS Feed">
    <link rel="alternate" type="application/atom+xml" href="{{ site.url }}/feed.xml" title="{{ site.name }} Atom Feed">
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//www.google-analytics.com">
    
    <!-- Humans.txt -->
    <link rel="author" href="{{ site.url }}/humans.txt" type="text/plain">
